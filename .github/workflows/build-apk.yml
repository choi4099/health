name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.14.3 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 테스트용 APK 빌드
        run: gradle assembleDebug --stacktrace

      - name: 테스트용 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: health-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 휴대폰용 다운로드 페이지(Releases)에 APK 올리기
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk health.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest health.apk --title "헬스 최신 테스트 버전 (빌드 ${{ github.run_number }})" --notes "휴대폰에서 health.apk 를 눌러 내려받아 설치하세요." --latest
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------- 아래는 서명 키(비밀값)가 등록된 경우에만 실행 ----------
      - name: 서명 키 준비
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "서명 키 비밀값(KEYSTORE_BASE64)이 없어 출시용 AAB는 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 출시용 AAB 빌드 (Google Play 업로드용)
        if: steps.key.outputs.ready == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: upload
        run: gradle bundleRelease --stacktrace

      - name: 출시용 AAB 업로드
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: health-play-aab-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: 서명 키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
